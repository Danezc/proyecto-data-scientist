# Configuración Supabase CLI
# Documentación: https://supabase.com/docs/guides/cli/config
#
# Pasos para conectar:
#   1. Crea un proyecto en https://app.supabase.com
#   2. Reemplaza "your-project-ref" con el Project Reference ID (Settings → General)
#   3. Ejecuta: supabase link --project-ref <project-ref>
#   4. Ejecuta: supabase db push

project_id = "your-project-ref"

[api]
port = 54321
schemas = ["public", "extensions"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323

[auth]
site_url = "http://localhost:3000"
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
